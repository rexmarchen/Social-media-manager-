name: LinkedIn RAG Agent

on:
  schedule:
    - cron: "15 14 * * *" # Daily at 14:15 UTC (7:45 PM IST) - Off-peak to avoid :00 GitHub Actions queue delays
  workflow_dispatch:
    inputs:
      force:
        description: "Force immediate post (bypasses interval gap check)"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python for Poster Engine
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          npm ci || npm install
          pip install pillow

      - name: Run LinkedIn Super Brain Agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_PERSON_URN: ${{ secrets.LINKEDIN_PERSON_URN }}
          LINKEDIN_VERSION: ${{ secrets.LINKEDIN_VERSION || '202603' }}
          GEMINI_TEXT_MODEL: ${{ secrets.GEMINI_TEXT_MODEL || 'gemini-3.6-flash' }}
          GEMINI_EMBEDDING_MODEL: ${{ secrets.GEMINI_EMBEDDING_MODEL || 'gemini-embedding-001' }}
          GEMINI_IMAGE_MODEL: ${{ secrets.GEMINI_IMAGE_MODEL || 'gemini-3.1-flash-image' }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}
          GITHUB_USERNAME: ${{ secrets.GITHUB_USERNAME || 'rexmarchen' }}
          POST_FREQUENCY: ${{ secrets.POST_FREQUENCY || 'daily' }}
          MIN_POST_GAP_HOURS: ${{ secrets.MIN_POST_GAP_HOURS || '12' }}
        run: node super-brain.js ${{ github.event.inputs.force == 'true' && '--force' || '' }}

      - name: Commit updated state
        run: |
          git config user.name "linkedin-agent-bot"
          git config user.email "actions@github.com"
          git add state.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: update rotation state [skip ci]"
            git pull --rebase origin main || true
            git push origin main
          fi
